name: Test

on: push

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests
        run: sbt "test;shutdown"
